<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Trip - Epic Journeys</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="form-page">


<div class="form-box booking-box">


<h2>
Book Your Trip
</h2>



<form action="mailto:abineshsarmaa@outlook.com" method="post" enctype="text/plain">



<input 
type="text" 
name="Name"
placeholder="Full Name"
required>



<input 
type="email"
name="Email"
placeholder="Email Address"
required>




<input 
type="tel"
name="Phone"
placeholder="Phone Number"
required>





<select name="Destination" required>

<option value="">
Select Destination
</option>

<option>
Switzerland
</option>

<option>
Maldives
</option>

<option>
Dubai
</option>

<option>
India Tour
</option>


</select>





<input
type="date"
name="Travel Date"
required>






<textarea
name="Message"
placeholder="Your Message">
</textarea>






<button type="submit">

Submit Booking

</button>



</form>


<br>


<a href="index.html" class="back-home">

← Back To Home

</a>



</div>


</section>



</body>

</html>
