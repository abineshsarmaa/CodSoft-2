<div class="booking-box">


<form action="mailto:abineshsarmaa@outlook.com"

name="Name"
placeholder="Full Name"
required>



<input type="email"
name="Email"
placeholder="Email Address"
required>



<input type="tel"
name="Phone"
placeholder="Phone Number"
required>




<select name="Package">

<option>
Select Package
</option>

<option>

</option>

<option>
Family Package
</option>

<option>
Adventure Trip
</option>

</select>




<input type="date"
name="Travel Date"
required>



<textarea
name="Message"
placeholder="Special Request">
</textarea>




<button>
Confirm Booking
</button>
