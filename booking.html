<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking - Epic Journeys</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="booking-page">


<div class="booking-box">


<h1>
Book Your Trip
</h1>

<button>
Confirm Booking
</button>


</form>


</div>


</section>

</html>
